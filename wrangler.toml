# Cloudflare Workers configuration for Next.js deployment
# See: https://opennext.js.org/cloudflare/get-started

name = "cmo-simulator"
main = ".open-next/worker.js"
compatibility_date = "2025-11-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Note: Build output directory for Cloudflare Pages should be set to ".open-next"
# Build command should be "npx opennextjs-cloudflare build"
