# Wrangler configuration for Cloudflare Pages
# This file configures the build output for Cloudflare Pages

name = "cmo-simulator"
compatibility_date = "2024-01-01"

# Node.js compatibility flags for Next.js
# These enable Node.js APIs needed by Next.js and OpenNext
compatibility_flags = ["nodejs_compat"]

# Specify the build output directory for Cloudflare Pages
# This tells Cloudflare Pages where to find the built files
pages_build_output_dir = ".open-next"

